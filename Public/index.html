<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Crazy Friends Battle</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:white;font:16px system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}#panel{position:absolute;inset:0;background:linear-gradient(135deg,#1e1b4b,#0f172a);display:grid;place-items:center;z-index:10}#card{background:#ffffff13;border:1px solid #ffffff33;border-radius:24px;padding:28px;width:min(94vw,440px);box-shadow:0 25px 80px #0006}h1{margin:0 0 10px;font-size:32px}p{color:#cbd5e1}input,select,button{width:100%;padding:13px;border-radius:12px;border:0;font:inherit;margin:6px 0}input,select{background:#f8fafc;color:#111827}button{background:#facc15;color:#111827;font-weight:800;cursor:pointer}button.secondary{background:#334155;color:white}#hud{position:absolute;left:12px;right:12px;top:12px;display:none;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}#hud>div{background:#0f172acb;border:1px solid #ffffff33;border-radius:12px;padding:9px;font-size:13px}#hud button{pointer-events:auto;padding:8px;font-size:12px;margin:2px;width:auto}#mobile{display:none;position:absolute;bottom:24px;left:20px;right:20px;justify-content:space-between;align-items:end;pointer-events:none}#stick{width:125px;height:125px;border-radius:50%;background:#ffffff26;border:2px solid #ffffff55;position:relative;pointer-events:auto;touch-action:none}#knob{width:54px;height:54px;background:#ffffffa0;border-radius:50%;position:absolute;left:34px;top:34px}#fire{width:95px;height:95px;border-radius:50%;background:#f97316;border:4px solid #fed7aa;pointer-events:auto;touch-action:none}#toast{position:absolute;top:85px;left:50%;transform:translateX(-50%);background:#991b1b;padding:12px 18px;border-radius:12px;display:none;z-index:20}#end{display:none;position:absolute;inset:0;background:#000b;place-items:center;text-align:center;z-index:9}#end section{background:#1e293b;padding:30px;border-radius:20px}small{color:#cbd5e1}#minimap{position:absolute;right:12px;bottom:14px;width:180px;height:132px;border:2px solid #ffffff99;border-radius:12px;pointer-events:none;box-shadow:0 5px 20px #0007}#panel~#minimap{display:none}@media(max-width:600px){#minimap{width:110px;height:81px;bottom:148px;right:8px}#card{padding:18px}h1{font-size:27px}}</style></head><body><canvas id="game"></canvas><div id="panel"><div id="card"><h1>🍅 Crazy Friends Battle</h1><p>True 3D cartoon arena • 20 friends • 2 teams • 8-minute battles</p><input id="name" maxlength="18" placeholder="Your funny nickname"/><select id="team"><option value="auto">Auto-assign team</option><option value="red">🔴 Red Team</option><option value="blue">🔵 Blue Team</option></select><input id="room" placeholder="Room code (leave blank to create)"/><button id="join">Create / Join Room</button><div id="lobby" style="display:none"><p id="roominfo"></p><button id="copy">📋 Copy Invite Link</button><div id="roster"></div><button id="start">Start Battle (Host Only)</button><button class="secondary" id="exitLobby">Leave Room</button></div><small>For friends on different devices, deploy this Node.js project to a public HTTPS host.</small></div></div><div id="hud"><div><strong id="clock">08:00</strong><div id="scores"></div><div id="status"></div></div><div><button id="share">Share link</button><button id="leave">Exit</button></div></div><div id="mobile"><div id="stick"><div id="knob"></div></div><button id="fire">🍅 FIRE</button></div><div id="toast"></div><div id="end"><section><h1 id="result"></h1><p>Battle finished!</p><button onclick="location.href=location.pathname">Back to Menu</button></section></div><script type="module" src="/game.js"></script></body></html>
